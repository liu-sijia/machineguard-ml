[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machineguard-ml"
version = "0.1.0"
description = "Reproducible equipment fault classification and indicator regression workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
machineguard = "machineguard_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
